{% extends "layout.html" %}
{% block content %}
<style>
  :root{
    --bg:#FFFFFF;
    --card:#FFFFFF;
    --ink:#0B1220;
    --muted:#64748B;
    --line:rgba(2,6,23,.08);
    --brand:#2F6AFF;
    --brand2:#1F5CE6;
    --shadow:0 14px 34px rgba(2,6,23,.10);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family: system-ui, -apple-system, "Segoe UI", Arial;
    background:var(--bg);
    color:var(--ink);
    display:flex;
  }
  .sidebar{
    width:220px;
    background:#fff;
    border-left:1px solid var(--line);
    padding:16px;
    min-height:100vh;
  }
  .sidebar a{display:block; margin:6px 0; text-decoration:none; color:inherit;}
  .main{flex:1;}
  .topbar{
    position:sticky;
    top:0;
    z-index:5;
    background:#fff;
    border-bottom:1px solid var(--line);
    padding:14px 18px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    box-shadow:0 8px 22px rgba(2,6,23,.06);
  }
  .left{
    display:flex;
    align-items:center;
    gap:12px;
  }
  .back{
    text-decoration:none;
    color:var(--brand);
    font-weight:700;
  }
  .wrap{
    max-width:1100px;
    margin:0 auto;
    padding:22px 18px;
  }
  .card{
    background:var(--card);
    border:1px solid var(--line);
    border-radius:18px;
    padding:20px;
    box-shadow:var(--shadow);
  }
  .title{
    font-size:20px;
    font-weight:900;
    margin-bottom:8px;
  }
  .meta{
    color:var(--muted);
    font-size:13px;
    margin-bottom:16px;
  }
  .placeholder{
    margin-top:20px;
    padding:30px;
    border-radius:14px;
    border:1px dashed rgba(47,106,255,.4);
    background:rgba(47,106,255,.05);
    color:var(--muted);
    text-align:center;
    font-size:14px;
  }
</style>

<div class="topbar">
  <div class="left">
    <a class="back" href="/dashboard">← الرجوع</a>
    <strong>{{ sheet_name }}</strong>
  </div>
</div>

<div class="wrap">
  <div class="card">
    <div class="title">{{ sheet_name }}</div>
    <div class="meta">
      المعرف: {{ sheet_id }}<br>
      المالك: {{ owner }}<br>
      تاريخ الإنشاء: {{ created_at }}<br>
      ملف الإكسل: {{ file_path }}
    </div>

    <a href="/sheet/{{ sheet_id }}/editor"
   style="
     display:inline-block;
     padding:12px 18px;
     background:linear-gradient(135deg,#2F6AFF,#1F5CE6);
     color:#fff;
     border-radius:12px;
     font-weight:800;
     text-decoration:none;
   ">
  فتح الشيت في المحرر
</a>

  </div>
</div>

{% endblock %}
